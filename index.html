<title>Espace Syndic</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F7F6F2; --surface:#FFFFFF; --ink:#22303C; --muted:#5B6B7A; --line:#E3E1DA;
  --accent:#1F4E78; --accent-ink:#FFFFFF; --chart1:#3D6FA8; --chart2:#C2680F;
  --ok-bg:#E4F3E9; --ok-ink:#1E6B40; --warn-bg:#FBEFD9; --warn-ink:#8F5400;
  --bad-bg:#FBE7E5; --bad-ink:#A9271C; --info-bg:#E3EDF7; --info-ink:#2C5E93;
  --grey-bg:#EAE9E4; --grey-ink:#5F6B76; --tile:#FFFFFF; --shadow:0 1px 2px rgba(34,48,60,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14181D; --surface:#1D242C; --ink:#E6EAEE; --muted:#98A5B3; --line:#2C3540;
    --accent:#7FA8D9; --accent-ink:#10151B; --chart1:#4E86D6; --chart2:#CC7229;
    --ok-bg:#173527; --ok-ink:#7CCF9C; --warn-bg:#3A2B10; --warn-ink:#E5B567;
    --bad-bg:#3D1D1A; --bad-ink:#F09A8F; --info-bg:#1B2C3F; --info-ink:#8FB7E3;
    --grey-bg:#262D35; --grey-ink:#9AA5AF; --tile:#1D242C; --shadow:none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14181D; --surface:#1D242C; --ink:#E6EAEE; --muted:#98A5B3; --line:#2C3540;
  --accent:#7FA8D9; --accent-ink:#10151B; --chart1:#4E86D6; --chart2:#CC7229;
  --ok-bg:#173527; --ok-ink:#7CCF9C; --warn-bg:#3A2B10; --warn-ink:#E5B567;
  --bad-bg:#3D1D1A; --bad-ink:#F09A8F; --info-bg:#1B2C3F; --info-ink:#8FB7E3;
  --grey-bg:#262D35; --grey-ink:#9AA5AF; --tile:#1D242C; --shadow:none;
  color-scheme: dark;
}
body{background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans Arabic", "Segoe UI", system-ui, sans-serif;
  font-size:15px; line-height:1.55; padding-inline:16px; padding-block:0 84px;}
#app{max-width:960px; margin-inline:auto;}
.hdr{display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding-block:18px 6px;}
.hgrp{display:flex; align-items:center; gap:12px; min-width:0;}
.hdr .mark{width:42px; height:42px; border-radius:10px; background:var(--accent); color:var(--accent-ink);
  display:grid; place-items:center; flex:none;}
.hdr h1{font-size:20px; font-weight:700; margin:0; letter-spacing:.2px;}
.hdr .sub{font-size:12.5px; color:var(--muted); margin-top:1px;}
.hdr .grow{flex:1;}
.ctl{display:flex; gap:8px; align-items:center;}
select,input[type=text],input[type=number],input[type=date]{font:inherit; font-size:13.5px; padding:7px 10px; border-radius:9px;
  border:1px solid var(--line); background:var(--surface); color:var(--ink); max-width:100%;}
button{font:inherit; cursor:pointer;}
.langbtn{font-size:13.5px; padding:7px 12px; border-radius:9px; border:1px solid var(--line);
  background:var(--surface); color:var(--accent); font-weight:700;}
button:focus-visible,select:focus-visible,input:focus-visible,.tab:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
.tabs{display:flex; gap:6px; overflow-x:auto; padding-block:12px; position:sticky; top:env(safe-area-inset-top,0px);
  background:var(--bg); z-index:5;}
.tab{font-size:13.5px; font-weight:500; white-space:nowrap; padding:8px 14px; border-radius:999px;
  border:1px solid var(--line); background:var(--surface); color:var(--muted);}
.tab[aria-selected="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:700;}
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-block:6px 16px;}
.kpi{background:var(--tile); border:1px solid var(--line); border-radius:12px; padding:12px 14px; box-shadow:var(--shadow);}
.kpi .lab{font-size:12px; color:var(--muted); letter-spacing:.2px;}
.kpi .val{font-size:21px; font-weight:700; font-variant-numeric:tabular-nums; margin-top:2px;}
.kpi .val small{font-size:12.5px; font-weight:500; color:var(--muted);}
.kpi.ok .val{color:var(--ok-ink);} .kpi.bad .val{color:var(--bad-ink);} .kpi.warn .val{color:var(--warn-ink);}
.card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px; margin-block-end:14px; box-shadow:var(--shadow);}
.card h2{font-size:15px; font-weight:700; margin:0 0 10px;}
.legend{display:flex; gap:14px; font-size:12.5px; color:var(--muted); margin-block-end:6px; flex-wrap:wrap;}
.legend .sw{display:inline-block; width:10px; height:10px; border-radius:3px; margin-inline-end:5px; vertical-align:-1px;}
table{border-collapse:collapse; width:100%; font-size:13.5px;}
.tblwrap{overflow-x:auto;}
th{font-size:11.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); font-weight:500;
  text-align:start; padding:7px 8px; border-bottom:1px solid var(--line); white-space:nowrap;}
td{padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:middle;}
td.num{font-variant-numeric:tabular-nums; white-space:nowrap;}
tr:last-child td{border-bottom:none;}
.mcell{width:24px; height:24px; border-radius:6px; display:grid; place-items:center; font-size:11px; font-weight:700;
  margin-inline:auto; border:none; background:transparent; padding:0; color:inherit;}
button.mcell{cursor:pointer;}
.mO{background:var(--ok-bg); color:var(--ok-ink);} .mN{background:var(--bad-bg); color:var(--bad-ink);}
.mA{background:var(--grey-bg); color:var(--grey-ink);} .mE{background:transparent; border:1px dashed var(--line);}
.pill{display:inline-block; font-size:12px; font-weight:700; padding:3px 10px; border-radius:999px; white-space:nowrap;}
.p-ok{background:var(--ok-bg); color:var(--ok-ink);} .p-adv{background:var(--info-bg); color:var(--info-ink);}
.p-part{background:var(--warn-bg); color:var(--warn-ink);} .p-bad{background:var(--bad-bg); color:var(--bad-ink);}
.p-grey{background:var(--grey-bg); color:var(--grey-ink);}
.rcard{display:flex; align-items:center; gap:12px; padding:11px 4px; border-bottom:1px solid var(--line);}
.rcard:last-child{border-bottom:none;}
.rnum{width:38px; height:38px; flex:none; border-radius:10px; background:var(--bad-bg); color:var(--bad-ink);
  display:grid; place-items:center; font-weight:700; font-size:13px;}
.rname{font-weight:700;} .rmeta{font-size:12.5px; color:var(--muted);}
.ramt{margin-inline-start:auto; text-align:end;}
.ramt .a{font-weight:700; color:var(--bad-ink); font-variant-numeric:tabular-nums; white-space:nowrap;}
.ramt .m{font-size:12px; color:var(--muted); white-space:nowrap;}
.hbar{display:grid; grid-template-columns:minmax(90px,150px) 1fr auto; gap:10px; align-items:center; padding-block:4px; font-size:13px;}
.hbar .track{background:var(--grey-bg); border-radius:5px; height:14px; overflow:hidden;}
.hbar .fill{height:100%; background:var(--chart2); border-radius:0 5px 5px 0; min-width:2px;}
[dir="rtl"] .hbar .fill{border-radius:5px 0 0 5px;}
.hbar .v{font-variant-numeric:tabular-nums; color:var(--muted); white-space:nowrap; font-size:12.5px;}
.tsrow{display:flex; justify-content:space-between; gap:10px; padding-block:7px; border-bottom:1px solid var(--line); font-size:13.5px; align-items:center;}
.tsrow:last-child{border-bottom:none;}
.tsrow .v{font-variant-numeric:tabular-nums; font-weight:500; white-space:nowrap;}
.v.plus{color:var(--ok-ink);} .v.minus{color:var(--bad-ink);}
.tsrow.total{font-weight:700; border-top:2px solid var(--line);}
.note{font-size:12.5px; color:var(--muted); background:var(--grey-bg); border-radius:9px; padding:9px 12px; margin-block-start:10px;}
.foot{font-size:12px; color:var(--muted); text-align:center; margin-block-start:22px;}
.empty{color:var(--muted); font-size:13.5px; padding-block:10px; text-align:center;}
svg text{font-family:inherit;}
.chip{display:inline-block; font-size:11px; padding:2px 8px; border-radius:999px; background:var(--info-bg); color:var(--info-ink); font-weight:500;}
.adminbar{background:var(--info-bg); color:var(--info-ink); border-radius:10px; padding:9px 13px;
  font-size:13px; font-weight:500; margin-block:4px 12px; display:none;}
.admin .adminbar{display:block;}
.admin-only{display:none;}
.admin .admin-only{display:block;}
.form{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-block-start:10px;}
.form input,.form select{flex:1 1 120px;}
.form input[type=number]{max-width:130px;}
.btn{padding:8px 16px; border-radius:9px; border:none; background:var(--accent); color:var(--accent-ink); font-weight:700; font-size:13.5px;}
.btn.ghost{background:var(--surface); color:var(--accent); border:1px solid var(--line);}
.delbtn{border:none; background:var(--bad-bg); color:var(--bad-ink); border-radius:7px; width:26px; height:26px; font-weight:700;}
.savebar{position:fixed; bottom:0; inset-inline:0; padding:10px 16px; z-index:20;
  padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
  background:var(--surface); border-top:1px solid var(--line); display:none;}
.savebar.on{display:flex; gap:10px; justify-content:center; align-items:center;}
.savebar .btn{min-width:230px;}
.savebar .hint{font-size:12.5px; color:var(--muted);}
.toast{position:fixed; bottom:76px; inset-inline:0; margin-inline:auto; width:fit-content; max-width:90%;
  background:var(--ink); color:var(--bg); padding:9px 18px; border-radius:999px; font-size:13.5px; z-index:30;
  opacity:0; transition:opacity .25s; pointer-events:none;}
.toast.on{opacity:1;}
@media (max-width:520px){ .hdr h1{font-size:17px;} .kpi .val{font-size:18px;} }
</style>

  cats:{"Nettoyage":"Nettoyage","Électricité":"Électricité","Eau":"Eau","Ascenseur":"Ascenseur","Sécurité":"Sécurité","Entretien":"Entretien","Réparation":"Réparation","Travaux":"Travaux","Assurance":"Assurance","Autres":"Autres"},

  foot:(d,adm)=>"Dernière mise à jour : "+d+" · Cotisation mensuelle : "+STATE.param+" DH"+(adm?"":" · Publication du syndic — consultation seule"),
  empty:"Aucune donnée pour cette année."},
ar:{dir:"rtl", locale:"ar-MA", cur:" درهم",
  title:"فضاء السنديك", subtitle:"تتبع شفاف لتدبير العمارة — 45 شقة",
  lang:"Français",
  tabs:{apercu:"لمحة عامة", cotisations:"الاشتراكات", retards:"المتأخرون 4 أشهر فأكثر", depenses:"المصاريف", tresorerie:"الخزينة"},
  kpi:{enc:"الاشتراكات المحصلة", imp:"غير المؤدى إلى اليوم", dep:"مصاريف السنة", solde:"رصيد الخزينة",

  of:n=>"من "+n,
  chartTitle:"التحصيلات والمصاريف حسب السنة", encaisse:"المحصل", depense:"المصاريف",

  cotTitle:"تأشير الاشتراكات الشهرية", cotNote:"✓ مؤدى للسنديك · ق (رمادي) = مؤدى للسنديك السابق · ✗ غير مؤدى. الحالة تُحتسب إلى غاية الشهر الجاري.",
  cotNoteAdmin:"وضع التدبير: انقر على خانة الشهر للتبديل: فارغ ← ✓ مؤدى ← ق سنديك سابق ← ✗ غير مؤدى.",
  months:["ينا","فبر","مار","أبر","ماي","يون","يول","غشت","شتن","أكت","نون","دجن"],
  th:{apt:"الشقة", nom:"المالك", paye:"المؤدى", statut:"الحالة", date:"التاريخ", cat:"الفئة", desc:"البيان", mnt:"المبلغ", mode:"الأداء", total:"المجموع"},
  statut:{ok:"خالص", adv:"خالص مسبقًا", part:"جزئي", bad:"غير خالص", futur:"لاحقًا"},
  retTitle:"الملاك المتأخرون 4 أشهر فأكثر",
  retMois:m=>m+" أشهر غير مؤداة", retDu:"المستحق", etage:"الطابق", abroad:"خارج الوطن",
  retNote:"يُحتسب التأخر إلى غاية الشهر الجاري، لجميع السنوات. الأشهر المؤداة للسنديك السابق لا تُعتبر تأخرًا.",
  retEmpty:"لا يوجد أي مالك متأخر بأربعة أشهر أو أكثر. 👏",
  depTitle:"سجل المصاريف",
  tsoTitle:"تفاصيل الخزينة", autresTitle:"مداخيل ومصاريف أخرى",
  tso:{ent:"مجموع المداخيل", sor:"مجموع المصاريف", solde:"الرصيد الحالي",
       init:"الرصيد الأولي (من السنديك السابق)", cotY:y=>"الاشتراكات المحصلة "+y,
       autresE:"مداخيل أخرى", depY:y=>"مصاريف "+y, autresS:"مصاريف أخرى", total:"الرصيد الحالي"},
  cats:{"Nettoyage":"النظافة","Électricité":"الكهرباء","Eau":"الماء","Ascenseur":"المصعد","Sécurité":"الحراسة","Entretien":"الصيانة","Réparation":"الإصلاح","Travaux":"الأشغال","Assurance":"التأمين","Autres":"أخرى"},
  modes:{"Espèces":"نقدًا","Chèque":"شيك","Virement":"تحويل بنكي","Carte bancaire":"بطاقة بنكية"},
  adm:{bar:"وضع التدبير — تعديلاتك لا تظهر للسكان إلا بعد النشر.",
       save:"نشر التعديلات", saving:"جارٍ النشر…", saved:"تم نشر التعديلات ✓",
       conflict:"توجد نسخة أحدث — جارٍ إعادة التحميل…", err:"فشل النشر، أعد المحاولة.",
       settings:"الإعدادات", param:"الاشتراك الشهري", initL:"الرصيد الأولي", apply:"تطبيق",
       addYear:"إنشاء سنة", addDep:"إضافة", addOp:"إضافة", entree:"مدخول", sortie:"مصروف",
       descPh:"البيان…", libPh:"البيان…", unsaved:n=>n+" تعديل(ات) في الانتظار"},
  foot:(d,adm)=>"آخر تحديث: "+d+" · الاشتراك الشهري: "+STATE.param+" درهمًا"+(adm?"":" · منشور من السنديك — للاطلاع فقط"),
  empty:"لا توجد بيانات لهذه السنة."},
};
const CATS = ["Nettoyage","Électricité","Eau","Ascenseur","Sécurité","Entretien","Réparation","Travaux","Assurance","Autres"];
const MODES = ["Espèces","Chèque","Virement","Carte bancaire"];

let lang = "fr", year, tab = "apercu", admin = false, dirty = 0, artifactNs = null;
try{ lang = localStorage.getItem("es-lang") || "fr"; }catch(e){}
const NOW = new Date(), NOWY = NOW.getFullYear(), NOWM = NOW.getMonth()+1;
const yearsAll = ()=>[...new Set([...STATE.cot.map(r=>r.an), ...STATE.dep.map(d=>+d.date.slice(0,4))])].sort();
year = yearsAll().includes(NOWY) ? NOWY : (yearsAll()[yearsAll().length-1] || NOWY);
try{ const y = +localStorage.getItem("es-year"); if(yearsAll().includes(y)) year = y; }catch(e){}
const TABS = ["apercu","cotisations","retards","depenses","tresorerie"];
if (TABS.includes(location.hash.slice(1))) tab = location.hash.slice(1);

const T = ()=>I18N[lang];
const fmt = n => n.toLocaleString("fr-MA") + T().cur;
const ownerByApt = ()=>Object.fromEntries(STATE.owners.map(o=>[o.apt,o]));
const dueMonths = y => y<NOWY ? 12 : (y===NOWY ? NOWM : 0);
const rowStats = r => {
  const paid = r.m.filter(v=>v==="O").length;
  const cov  = paid + r.m.filter(v=>v==="A").length;
  const due  = dueMonths(r.an);
  let st = "part";
  if (r.an>NOWY) st="futur"; else if (cov>due) st="adv"; else if (cov>=due) st="ok";
  else if (cov===0) st="bad";
  return {paid, cov, due, unpaid: Math.max(0,due-cov), st};
};
function retards(){
  const per = {}, oba = ownerByApt();
  STATE.cot.forEach(r=>{ const s=rowStats(r); per[r.apt]=(per[r.apt]||0)+s.unpaid; });
  return Object.entries(per).map(([apt,m])=>({apt:+apt,mois:m,mnt:m*STATE.param,o:oba[+apt]}))
    .filter(x=>x.mois>=4 && x.o).sort((a,b)=>b.mois-a.mois || a.apt-b.apt);
}
const encYear = y => STATE.cot.filter(r=>r.an===y).reduce((s,r)=>s+rowStats(r).paid,0)*STATE.param;
const impYear = y => STATE.cot.filter(r=>r.an===y).reduce((s,r)=>s+rowStats(r).unpaid,0)*STATE.param;
const depYear = y => STATE.dep.filter(d=>+d.date.slice(0,4)===y).reduce((s,d)=>s+d.mnt,0);
const totEnc = () => STATE.cot.reduce((s,r)=>s+rowStats(r).paid,0)*STATE.param;
const totDep = () => STATE.dep.reduce((s,d)=>s+d.mnt,0);
const autresE = () => STATE.autres.reduce((s,a)=>s+(a.ent||0),0);
const autresS = () => STATE.autres.reduce((s,a)=>s+(a.sor||0),0);
const solde = () => STATE.init + totEnc() + autresE() - totDep() - autresS();

const $ = id => document.getElementById(id);
const esc = s => String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(msg){ const el=$("toast"); el.textContent=msg; el.classList.add("on");
  clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove("on"), 2600); }
function markDirty(){ dirty++; render(); }

function render(){
  const t = T();
  $("app").dir = t.dir; $("saveBar").dir = t.dir;
  document.documentElement.lang = lang;
  document.body.classList.toggle("admin", admin);
  $("title").textContent = t.title;
  $("subtitle").textContent = t.subtitle;
  $("langBtn").textContent = t.lang;
  $("adminBar").textContent = t.adm.bar;
  const years = yearsAll();
  $("yearSel").innerHTML = years.map(y=>`<option value="${y}" ${y===year?"selected":""}>${y}</option>`).join("");
  $("tabs").innerHTML = TABS.map(k =>
    `<button class="tab" role="tab" id="tab-${k}" aria-selected="${k===tab}" data-k="${k}">${t.tabs[k]}</button>`).join("");
  TABS.forEach(k => { $("pane-"+k).hidden = (k!==tab); });

  // KPIs
  const ret = retards();
  const rowsY = STATE.cot.filter(r=>r.an===year);
  const okN = rowsY.filter(r=>["ok","adv"].includes(rowStats(r).st)).length;
  const nOwn = STATE.owners.length, s = solde();
  $("kpis").innerHTML = [
    {l:`${t.kpi.enc} ${year}`, v:fmt(encYear(year)), c:"ok"},
    {l:`${t.kpi.imp} (${year})`, v:fmt(impYear(year)), c: impYear(year)>0?"bad":"ok"},
    {l:`${t.kpi.dep} ${year}`, v:fmt(depYear(year)), c:""},
    {l:t.kpi.solde, v:fmt(s), c: s<0?"bad":"ok"},
    {l:t.kpi.ajour+" ("+year+")", v:`${okN} <small>${t.of(nOwn)}</small>`, c:"ok"},
    {l:t.kpi.ret4, v:`${ret.length} <small>${t.of(nOwn)}</small>`, c: ret.length?"bad":"ok"},
  ].map(k=>`<div class="kpi ${k.c}"><div class="lab">${k.l}</div><div class="val">${k.v}</div></div>`).join("");

  // chart
  $("chartTitle").textContent = t.chartTitle;
  $("chartLegend").innerHTML =
    `<span><span class="sw" style="background:var(--chart1)"></span>${t.encaisse}</span>`+
    `<span><span class="sw" style="background:var(--chart2)"></span>${t.depense}</span>`;
  const vals = years.map(y=>({y, e:encYear(y), d:depYear(y)}));
  const max = Math.max(1, ...vals.flatMap(v=>[v.e,v.d]));
  const W=560, H=210, P={t:14,r:10,b:26,l:8}, ih=H-P.t-P.b;
  const gw=(W-P.l-P.r)/Math.max(1,vals.length), bw=Math.min(38,gw/3);
  let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:320px" role="img" aria-label="${t.chartTitle}">`;
  for(let i=1;i<=3;i++){ const gy=P.t+ih-ih*i/3;
    svg+=`<line x1="${P.l}" x2="${W-P.r}" y1="${gy}" y2="${gy}" stroke="var(--line)" stroke-width="1"/>`;}
  svg+=`<line x1="${P.l}" x2="${W-P.r}" y1="${P.t+ih}" y2="${P.t+ih}" stroke="var(--muted)" stroke-width="1"/>`;
  vals.forEach((v,i)=>{
    const cx=P.l+gw*i+gw/2;
    [["e","--chart1",t.encaisse],["d","--chart2",t.depense]].forEach(([k,c,lab],j)=>{
      const h=ih*v[k]/max, x=cx+(j===0?-bw-2:2), y=P.t+ih-h;
      svg+=`<g><rect x="${x}" y="${y}" width="${bw}" height="${Math.max(h,1)}" rx="4" fill="var(${c})">`+
           `<title>${lab} ${v.y} : ${fmt(v[k])}</title></rect>`+
           (v[k]>0?`<text x="${x+bw/2}" y="${y-4}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${(v[k]/1000).toFixed(v[k]>=10000?0:1)}k</text>`:"")+`</g>`;
    });
    svg+=`<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600">${v.y}</text>`;
  });
  svg+="</svg>";
  $("yearChart").innerHTML = svg;

  // catégories
  $("catTitle").textContent = `${t.catTitle} — ${year}`;
  const byCat = {};
  STATE.dep.filter(d=>+d.date.slice(0,4)===year).forEach(d=>{ byCat[d.cat]=(byCat[d.cat]||0)+d.mnt; });
  const cats = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const cmax = Math.max(1,...cats.map(c=>c[1]));
  $("catBars").innerHTML = cats.length ? cats.map(([c,v])=>
    `<div class="hbar"><span>${t.cats[c]||c}</span>`+
    `<div class="track"><div class="fill" style="width:${Math.max(2,100*v/cmax)}%"></div></div>`+
    `<span class="v">${fmt(v)}</span></div>`).join("")
    : `<div class="empty">${t.empty}</div>`;

  // réglages admin
  $("setTitle").textContent = t.adm.settings;
  $("setParamL").textContent = t.adm.param;
  $("setInitL").textContent = t.adm.initL;
  $("setApply").textContent = t.adm.apply;
  if (document.activeElement !== $("setParam")) $("setParam").value = STATE.param;
  if (document.activeElement !== $("setInit")) $("setInit").value = STATE.init;

  // cotisations
  $("cotTitle").textContent = `${t.cotTitle} — ${year}`;
  $("cotNote").textContent = admin ? t.cotNoteAdmin : t.cotNote;
  const stPill = st => `<span class="pill p-${({ok:"ok",adv:"adv",part:"part",bad:"bad",futur:"grey"})[st]}">${t.statut[st]}</span>`;
  const sym = v => v==="O"?"✓":v==="A"?(lang==="ar"?"ق":"A"):v==="N"?"✗":"";
  const cls = v => v==="O"?"mO":v==="A"?"mA":v==="N"?"mN":"mE";
  const oba = ownerByApt();
  const rows = STATE.cot.map((r,i)=>({r,i})).filter(x=>x.r.an===year).sort((a,b)=>a.r.apt-b.r.apt);
  $("cotTable").innerHTML =
    `<tr><th>${t.th.apt}</th><th>${t.th.nom}</th>${t.months.map(m=>`<th style="text-align:center">${m}</th>`).join("")}<th>${t.th.paye}</th><th>${t.th.statut}</th></tr>`+
    (rows.length ? rows.map(({r,i})=>{ const s=rowStats(r); const o=oba[r.apt]||{nom:"?"};
      return `<tr><td class="num">${r.apt}</td><td style="white-space:nowrap">${esc(o.nom)}</td>`+
        r.m.map((v,mi)=> admin
          ? `<td><button type="button" class="mcell ${cls(v)}" data-ri="${i}" data-mi="${mi}">${sym(v)}</button></td>`
          : `<td><span class="mcell ${cls(v)}">${sym(v)}</span></td>`).join("")+
        `<td class="num">${fmt(s.paid*STATE.param)}</td><td>${stPill(s.st)}</td></tr>`; }).join("")
     : `<tr><td colspan="16" class="empty">${t.empty}</td></tr>`);
  const existing = new Set(STATE.cot.map(r=>r.an));
  const candidates = []; for(let y=NOWY-1; y<=NOWY+3; y++) if(!existing.has(y)) candidates.push(y);
  $("newYearSel").innerHTML = candidates.map(y=>`<option value="${y}">${y}</option>`).join("");
  $("addYearBtn").textContent = t.adm.addYear;
  $("yearForm").style.display = candidates.length ? "" : "none";

  // retards
  $("retTitle").textContent = t.retTitle;
  $("retNote").textContent = t.retNote;
  $("retList").innerHTML = ret.length ? ret.map(x=>
    `<div class="rcard"><div class="rnum">${x.mois}</div>`+
    `<div><div class="rname">${esc(x.o.nom)} ${x.o.rem?`<span class="chip">${lang==="ar"?esc(x.o.rem):t.abroad}</span>`:""}</div>`+
    `<div class="rmeta">${t.th.apt} ${x.apt} · ${t.etage} ${x.o.etage} · ${t.retMois(x.mois)}</div></div>`+
    `<div class="ramt"><div class="a">${fmt(x.mnt)}</div><div class="m">${t.retDu}</div></div></div>`).join("")
    : `<div class="empty">${t.retEmpty}</div>`;

  // dépenses
  $("depTitle").textContent = `${t.depTitle} — ${year}`;
  const deps = STATE.dep.map((d,i)=>({d,i})).filter(x=>+x.d.date.slice(0,4)===year);
  const dtot = deps.reduce((s,x)=>s+x.d.mnt,0);
  $("depTable").innerHTML =
    `<tr><th>${t.th.date}</th><th>${t.th.cat}</th><th>${t.th.desc}</th><th>${t.th.mnt}</th><th>${t.th.mode}</th>${admin?"<th></th>":""}</tr>`+
    (deps.length ? deps.map(({d,i})=>{
      const dd = new Date(d.date+"T00:00:00");
      return `<tr><td class="num">${dd.toLocaleDateString(t.locale)}</td>`+
      `<td><span class="pill p-grey">${t.cats[d.cat]||d.cat}</span></td>`+
      `<td>${esc(d.desc)}</td><td class="num">${fmt(d.mnt)}</td><td>${t.modes[d.mode]||d.mode||""}</td>`+
      (admin?`<td><button type="button" class="delbtn" data-deldep="${i}" aria-label="Supprimer">✕</button></td>`:"")+`</tr>`;}).join("")+
      `<tr><td></td><td></td><td style="font-weight:700">${t.th.total}</td><td class="num" style="font-weight:700">${fmt(dtot)}</td><td></td>${admin?"<td></td>":""}</tr>`
     : `<tr><td colspan="${admin?6:5}" class="empty">${t.empty}</td></tr>`);
  $("depCat").innerHTML = CATS.map(c=>`<option value="${c}">${t.cats[c]}</option>`).join("");
  $("depMode").innerHTML = MODES.map(m=>`<option value="${m}">${t.modes[m]}</option>`).join("");
  $("depDesc").placeholder = t.adm.descPh;
  $("depAdd").textContent = t.adm.addDep;
  if(!$("depDate").value) $("depDate").value = NOW.toISOString().slice(0,10);

  // trésorerie
  const ent = totEnc()+autresE(), sor = totDep()+autresS();
  $("tsoKpis").innerHTML = [
    {l:t.tso.ent, v:fmt(STATE.init+ent), c:"ok"},
    {l:t.tso.sor, v:fmt(sor), c:"bad"},
    {l:t.tso.solde, v:fmt(solde()), c:solde()<0?"bad":"ok"},
  ].map(k=>`<div class="kpi ${k.c}"><div class="lab">${k.l}</div><div class="val">${k.v}</div></div>`).join("");
  $("tsoTitle").textContent = t.tsoTitle;
  let dRows = [[t.tso.init, STATE.init, +1]];
  years.forEach(y=>{ const e=encYear(y); if(e||y<=NOWY) dRows.push([t.tso.cotY(y), e, +1]); });
  if (autresE()) dRows.push([t.tso.autresE, autresE(), +1]);
  years.forEach(y=>{ const d=depYear(y); if(d) dRows.push([t.tso.depY(y), d, -1]); });
  if (autresS()) dRows.push([t.tso.autresS, autresS(), -1]);
  $("tsoDetail").innerHTML = dRows.map(([l,v,sg])=>
    `<div class="tsrow"><span>${l}</span><span class="v ${sg>0?"plus":"minus"}">${sg>0?"+":"−"} ${fmt(v)}</span></div>`).join("")+
    `<div class="tsrow total"><span>${t.tso.total}</span><span class="v ${solde()<0?"minus":"plus"}">${fmt(solde())}</span></div>`;

  // autres opérations
  $("autresTitle").textContent = t.autresTitle;
  $("autresCard").style.display = (STATE.autres.length || admin) ? "" : "none";
  $("autresList").innerHTML = STATE.autres.length ? STATE.autres.map((a,i)=>{
    const v = a.ent ? [a.ent, "plus", "+"] : [a.sor, "minus", "−"];
    return `<div class="tsrow"><span>${esc(a.lib)} <span class="rmeta">${a.date? new Date(a.date+"T00:00:00").toLocaleDateString(t.locale):""}</span></span>`+
      `<span style="display:flex;gap:8px;align-items:center"><span class="v ${v[1]}">${v[2]} ${fmt(v[0])}</span>`+
      (admin?`<button type="button" class="delbtn" data-delop="${i}" aria-label="Supprimer">✕</button>`:"")+`</span></div>`;
  }).join("") : (admin?"":`<div class="empty">—</div>`);
  $("opLib").placeholder = t.adm.libPh;
  $("opType").innerHTML = `<option value="ent">${t.adm.entree}</option><option value="sor">${t.adm.sortie}</option>`;
  $("opAdd").textContent = t.adm.addOp;
  if(!$("opDate").value) $("opDate").value = NOW.toISOString().slice(0,10);

  // barre de publication
  const sb = $("saveBar");
  sb.classList.toggle("on", admin && dirty>0);
  $("saveBtn").textContent = t.adm.save;
  $("saveHint").textContent = t.adm.unsaved(dirty);

  const upd = STATE.updated ? new Date(STATE.updated).toLocaleDateString(t.locale) : "—";
  $("foot").textContent = t.foot(upd, admin);
}

// ---------- publication (mode gestion)
function buildHtml(){
  STATE.updated = new Date().toISOString();
  const json = JSON.stringify(STATE).replace(/</g,"\\u003c");
  return PRISTINE.replace(
    /(<script[^>]*id="STATE"[^>]*>)[\s\S]*?(<\/script>)/,
    (m, a, b) => a + json + b);
}
async function publishNow(){
  if(!artifactNs) return;
  const t = T();
  const btn = $("saveBtn");
  btn.disabled = true; btn.textContent = t.adm.saving;
  try{
    await artifactNs.publish(buildHtml());
    dirty = 0; toast(t.adm.saved);
  }catch(err){
    if(err && err.code === "conflict"){ toast(t.adm.conflict); }
    else { toast(t.adm.err); }
  }
  btn.disabled = false;
  render();
}

// ---------- événements
$("app").addEventListener("click", e=>{
  const tb = e.target.closest(".tab");
  if(tb){ tab = tb.dataset.k; try{history.replaceState(null,"","#"+tab);}catch(err){} render(); return; }
  const mc = e.target.closest("button.mcell");
  if(mc && admin){
    const r = STATE.cot[+mc.dataset.ri];
    const cycle = {"":"O","O":"A","A":"N","N":""};
    r.m[+mc.dataset.mi] = cycle[r.m[+mc.dataset.mi] || ""];
    markDirty(); return;
  }
  const dd = e.target.closest("[data-deldep]");
  if(dd && admin){ STATE.dep.splice(+dd.dataset.deldep,1); markDirty(); return; }
  const dop = e.target.closest("[data-delop]");
  if(dop && admin){ STATE.autres.splice(+dop.dataset.delop,1); markDirty(); return; }
});
$("langBtn").addEventListener("click", ()=>{
  lang = lang==="fr" ? "ar" : "fr";
  try{ localStorage.setItem("es-lang", lang); }catch(e){}
  render();
});
$("yearSel").addEventListener("change", e=>{
  year = +e.target.value;
  try{ localStorage.setItem("es-year", String(year)); }catch(e){}
  render();
});
$("setApply").addEventListener("click", ()=>{
  const p = +$("setParam").value, i = +$("setInit").value;
  if(!isNaN(p) && p>=0 && p!==STATE.param){ STATE.param = p; dirty++; }
  if(!isNaN(i) && i!==STATE.init){ STATE.init = i; dirty++; }
  render();
});
$("addYearBtn").addEventListener("click", ()=>{
  const y = +$("newYearSel").value;
  if(!y || STATE.cot.some(r=>r.an===y)) return;
  STATE.owners.forEach(o=>STATE.cot.push({an:y, apt:o.apt, m:["","","","","","","","","","","",""]}));
  year = y; markDirty();
});
$("depAdd").addEventListener("click", ()=>{
  const d = $("depDate").value, mnt = +$("depMnt").value;
  if(!d || !mnt || mnt<=0) { toast("…"); return; }
  STATE.dep.push({date:d, cat:$("depCat").value, desc:$("depDesc").value.trim()||"—", mnt, mode:$("depMode").value});
  STATE.dep.sort((a,b)=>a.date<b.date?-1:1);
  $("depDesc").value=""; $("depMnt").value="";
  year = +d.slice(0,4); markDirty();
});
$("opAdd").addEventListener("click", ()=>{
  const d = $("opDate").value, mnt = +$("opMnt").value;
  if(!d || !mnt || mnt<=0) { toast("…"); return; }
  const op = {date:d, lib:$("opLib").value.trim()||"—", ent:0, sor:0};
  op[$("opType").value] = mnt;
  STATE.autres.push(op);
  $("opLib").value=""; $("opMnt").value="";
  markDirty();
});
$("saveBtn").addEventListener("click", publishNow);
window.addEventListener("beforeunload", e=>{ if(dirty>0){ e.preventDefault(); e.returnValue=""; } });

render();

// ---------- capacités (mode gestion pour le syndic uniquement)
(async ()=>{
  try{
    if(!window.claude || !window.claude.use) return;
    const [user, art] = await Promise.all([claude.use("user"), claude.use("artifact")]);
    artifactNs = art;
    admin = !!(art && user && user.canEdit && user.canEdit());
    if(admin) render();
  }catch(e){}
})();
</script>

</body>
</html>
